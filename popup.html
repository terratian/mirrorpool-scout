<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mirror Pool Scout</title>
    <style>
        body {
            margin: 0;
            padding: 14px;
            width: 260px;
            background-color: #030712;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .header {
            font-size: 11px;
            font-weight: 700;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }
        .btn {
            width: 100%;
            background-color: #10b981;
            color: #030712;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 6px;
            text-align: center;
        }
        .btn:hover { background-color: #059669; color: #fff; }
        .btn-secondary {
            background-color: #1e293b;
            color: #cbd5e1;
        }
        .btn-secondary:hover { background-color: #334155; }
    </style>
</head>
<body>
    <div class="header">
        <span>🔮 MP SCOUT</span>
        <span style="color: #38bdf8;">v1.2.0</span>
    </div>
    <button class="btn" id="open-dash">📊 Open Full Dashboard</button>
    <script src="popup.js"></script>
</body>
</html>
