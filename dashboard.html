<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mirror Pool Scout</title>
    <style>
        :root {
            --bg-base: #030712;
            --bg-panel: #0b1120;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Navigation */
        .sidebar {
            width: 220px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .brand-logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-section {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .nav-item.active {
            border-left: 3px solid var(--accent-green);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Cards & Panels */
        .card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .metric-box {
            background-color: var(--bg-card);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Buttons & Inputs */
        textarea {
            width: 100%;
            height: 80px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .btn:hover { background-color: #2563eb; }
        .btn-green { background-color: var(--accent-green); color: #030712; }
        .btn-green:hover { background-color: #059669; color: white; }

        /* Footer */
        .footer {
            margin-top: auto;
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .footer a { color: var(--accent-green); text-decoration: none; }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="brand-logo">
            🔮 MIRROR POOL
        </div>

        <div class="nav-section">Workspace</div>
        <a href="#" class="nav-item active">📊 Watchlist</a>
        <a href="#" class="nav-item">🎯 Card Chase</a>
        <a href="#" class="nav-item">⚖️ Arbitrage Desk</a>
        <a href="#" class="nav-item">📈 Market Insights</a>

        <div class="nav-section">Preferences</div>
        <a href="#" class="nav-item">⚙️ Settings & API</a>

        <div class="footer">
            Alpha Build<br><a href="https://gumroad.com" target="_blank">Upgrade ($9 Lifetime)</a>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <div class="header-title">
            <span>Watchlist & Portfolios</span>
        </div>

        <!-- Action / Scrape Controls -->
        <div class="card">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Quick Deck Import & Brew</div>
            <textarea id="manual-deck-input" placeholder="Paste decklist here (e.g. 4 Thoughtseize)..."></textarea>
            <button class="btn btn-green" id="load-brew-btn">🛠️ Load & Analyze Brew</button>
            <button class="btn" id="import-deck-btn">🌐 Scrape Active Tab (MTGDecks)</button>
        </div>

        <!-- Active Deck Panel / Metrics HUD -->
        <div class="card" id="active-deck-panel" style="display: none;">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--accent-green);">Active Deck Metrics</div>
            
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-label">Win Rate</div>
                    <div class="metric-value" id="hud-winrate" style="color: var(--accent-green);">54.2%</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Paper Value</div>
                    <div class="metric-value" id="hud-paper" style="color: var(--accent-gold);">$0.00</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">MTGO TIX</div>
                    <div class="metric-value" id="hud-mtgo" style="color: var(--accent-blue);">0.0 TIX</div>
                </div>
            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn" id="share-deck-btn" style="margin-bottom: 0;">📋 Export List</button>
                <button class="btn" id="export-mtga-btn" style="margin-bottom: 0; background-color: #334155;">🎮 Copy MTGA</button>
            </div>
        </div>

    </div>

    <script src="dashboard.js"></script>
</body>
</html>
